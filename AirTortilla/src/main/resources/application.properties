# Puerto de la web: http://localhost:8080
server.port=8080

# Rutas por defecto (relativas a la carpeta AirTortilla)
airtortilla.entrada=data/AirTortilla_Reservas_2020.csv
airtortilla.salida=output

# Abrir el navegador automáticamente al arrancar
airtortilla.abrir-navegador=true

# Tamaño máximo del CSV que se puede subir desde la web
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.main.banner-mode=off
