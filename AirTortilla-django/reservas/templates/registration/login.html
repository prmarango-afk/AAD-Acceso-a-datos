<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirTortilla · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FFB627'/%3E%3Cpath d='M8 18l16-6-4 8z' fill='%230B1020'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --sky: #060914;
      --text: #F2F5FC;
      --muted: #A3AECB;
      --amber: #FFB627;
      --amber-2: #FFCF6B;
      --red: #FF7676;
      --glass-bg: linear-gradient(140deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04) 45%, rgba(255, 255, 255, .07));
      --glass-border: rgba(255, 255, 255, .16);
      --glass-shadow: 0 1px 0 rgba(255, 255, 255, .28) inset, 0 24px 60px -12px rgba(0, 0, 0, .55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(1400px 900px at 70% -20%, #142250 0%, transparent 60%), var(--sky);
      color: var(--text);
      font-family: "Geist", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      overflow-x: hidden;
    }
    .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .aurora span { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; animation: flotar 26s ease-in-out infinite alternate; }
    .aurora span:nth-child(1) { width: 52vw; height: 52vw; left: -14vw; top: 18vh; background: radial-gradient(circle, #FF9D2E, transparent 65%); }
    .aurora span:nth-child(2) { width: 46vw; height: 46vw; right: -10vw; top: -12vh; background: radial-gradient(circle, #3D6BFF, transparent 65%); animation-duration: 32s; }
    @keyframes flotar { to { transform: translate(6vw, -5vh) scale(1.12); } }

    .panel {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      border-radius: 22px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      backdrop-filter: blur(22px) saturate(170%);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand svg { width: 38px; height: 38px; }
    .brand b { display: block; font-size: 20px; }
    .brand span { color: var(--muted); font-size: 13px; }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 18px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .06);
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--amber-2), var(--amber));
      color: #1A1204;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    .error {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 118, 118, .12);
      border: 1px solid rgba(255, 118, 118, .4);
      color: var(--red);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span></div>

  <main class="panel">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#FFB627"/><path d="M8 18l16-6-4 8z" fill="#0B1020"/></svg>
      <div>
        <b>AirTortilla</b>
        <span>Booking System</span>
      </div>
    </div>

    <h1>Iniciar sesión</h1>

    {% if form.errors %}
      <p class="error">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Usuario</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>

      <label for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>

      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
